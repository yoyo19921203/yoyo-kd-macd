<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Yoyo 多策略選股觀察</title>
<style>
:root{--bg:#0b1120;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--blue:#315efb;--green:#08783d;--orange:#b45309;--red:#b91c1c}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:var(--ink)}
header{background:var(--bg);color:#fff;padding:22px 18px}.wrap{max-width:1280px;margin:auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.gate{max-width:420px;margin:80px auto}.gate input{width:100%;padding:12px;font-size:20px;text-align:center;margin:10px 0;border:1px solid var(--line);border-radius:8px}
button{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 16px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.filters label{background:#f3f4f6;border-radius:999px;padding:7px 10px;font-size:13px}
select,input[type=search]{padding:7px;border:1px solid var(--line);border-radius:7px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.tab{border:1px solid var(--line);background:#fff;color:#374151}.tab.active{background:var(--bg);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px}.stat{padding:12px;border:1px solid var(--line);border-radius:10px}.stat b{font-size:22px;display:block}
.tablewrap{overflow:auto;max-height:70vh} table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}th{position:sticky;top:0;background:#fff;color:var(--muted);z-index:1}
th:nth-child(1),th:nth-child(2),td:nth-child(1),td:nth-child(2){text-align:left}
.tag{padding:2px 7px;border-radius:999px;font-size:11px}.y{background:#e7f7ee;color:var(--green)}.n{background:#f3f4f6;color:#777}
.seed{background:#fff7ed;color:#9a3412}.turn{background:#ffedd5;color:#c2410c}.confirm{background:#fee2e2;color:#991b1b}
.pos{color:var(--green)}.neg{color:var(--red)}.muted{color:var(--muted);font-size:12px}.count{font-size:13px;color:var(--muted)}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="gate" class="gate card"><h2>輸入密碼</h2><input id="pw" type="password" inputmode="numeric"><div id="err" class="muted"></div><button onclick="unlock()">進入</button></div>
<div id="app" style="display:none">
<header><div class="wrap"><h2 style="margin:0">Yoyo 多策略選股觀察</h2><div id="sub" class="muted"></div></div></header>
<div class="wrap">
<div class="card">
<div class="tabs">
<button class="tab active" data-strategy="all">全部候選</button>
<button class="tab" data-strategy="old">KD＋MACD</button>
<button class="tab" data-strategy="seed">🟡 底部萌芽</button>
<button class="tab" data-strategy="turn">🟠 底部轉強</button>
<button class="tab" data-strategy="confirm">🔴 底部確認</button>
</div>
<div class="filters">
<label>日期 <select id="date"></select></label>
<label>市場 <select id="market"><option value="all">全部</option><option>上市</option><option>上櫃</option></select></label>
<label>搜尋 <input id="q" type="search" placeholder="代號/名稱"></label>
<label><input type="checkbox" id="vol"> 量能符合</label>
<label><input type="checkbox" id="kd3"> KD3強勢</label>
<label><input type="checkbox" id="macd"> MACD130&gt;0</label>
<label><input type="checkbox" id="rs5"> RS5&gt;0</label>
<label><input type="checkbox" id="rs20"> RS20&gt;0</label>
<label>20日均量 ≥ <select id="minvol"><option value="0">不限</option><option value="100">100張</option><option value="500">500張</option><option value="1000">1000張</option><option value="3000">3000張</option></select></label>
<label>底部分數 ≥ <select id="score"><option value="0">不限</option><option value="50">50</option><option value="60">60</option><option value="70">70</option><option value="80">80</option></select></label>
</div>
</div>

<div class="card stats">
<div class="stat"><span class="muted">目前顯示</span><b id="nshow">0</b></div>
<div class="stat"><span class="muted">底部萌芽</span><b id="nseed">0</b></div>
<div class="stat"><span class="muted">底部轉強</span><b id="nturn">0</b></div>
<div class="stat"><span class="muted">底部確認</span><b id="nconfirm">0</b></div>
</div>

<div class="card" id="btCard" style="display:none"><b>底部策略回測</b><div id="bt" class="muted" style="margin-top:8px"></div></div>

<div class="card"><div id="count" class="count"></div><div class="tablewrap"><table><thead><tr>
<th>市場</th><th>代號 名稱</th><th>策略</th><th>底部分數</th><th>收盤</th><th>K/D</th><th>KD交叉</th><th>量能</th><th>20日均量</th><th>MACD130</th><th>OSC</th><th>MA5/10/20</th><th>60日回檔</th><th>RS5</th><th>RS20</th>
</tr></thead><tbody id="body"></tbody></table></div></div>
<div class="card muted">
<strong>底部萌芽：</strong>近60日曾明顯下跌、近低檔築底、MA5/10/20收斂，DIF/MACD仍偏負但動能開始改善。<br>
<strong>底部轉強：</strong>萌芽基礎上，KD在低檔最近3日內黃金交叉，股價開始站回MA5附近。<br>
<strong>底部確認：</strong>轉強後再接近/站回MA10、MA20且5日均量不弱於10日均量。<br>
這些是策略觀察條件，不代表未來一定上漲；建議搭配回測與風險控管。
</div>
</div></div>
<script>
const PW_HASH="ea01aa3c1ba251e379ac169014631901f032db13a1d838b431786a6c33c9c8c1";
async function hash(s){let b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function unlock(){if(await hash(pw.value.trim())===PW_HASH){sessionStorage.setItem("u","1");gate.style.display="none";app.style.display="block";init()}else err.textContent="密碼錯誤"}
pw.addEventListener("keydown",e=>{if(e.key==="Enter")unlock()}); if(sessionStorage.getItem("u")==="1"){gate.style.display="none";app.style.display="block";init()}
let rows=[],strategy="all";
const ids=["market","q","vol","kd3","macd","rs5","rs20","minvol","score"];
async function init(){
 let dates=[];try{dates=await (await fetch("data/dates.json",{cache:"no-store"})).json()}catch(e){}
 date.innerHTML="";[...dates].reverse().forEach(d=>date.add(new Option(`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`,d)));
 date.onchange=()=>load(date.value); ids.forEach(id=>document.getElementById(id).addEventListener("input",render));
 document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");strategy=b.dataset.strategy;render()});
 try{let b=await (await fetch("data/backtest.json",{cache:"no-store"})).json();showBacktest(b)}catch(e){}
 if(dates.length)load(dates[dates.length-1]);
}
async function load(d){rows=await (await fetch(`data/${d}.json`,{cache:"no-store"})).json();sub.textContent=`資料日期：${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`;render()}
function okStrategy(r){if(strategy==="old")return r.old_candidate;if(strategy==="seed")return r.bottom_seed;if(strategy==="turn")return r.bottom_turn;if(strategy==="confirm")return r.bottom_confirm;return true}
function render(){
 let m=market.value,qq=q.value.trim().toLowerCase(),mv=+minvol.value,sc=+score.value;
 let x=rows.filter(r=>okStrategy(r)&&(m==="all"||r.market===m)&&(!qq||(`${r.code}${r.name}`).toLowerCase().includes(qq))&&(!vol.checked||r.vol_ok)&&(!kd3.checked||r.kd3_strong)&&(!macd.checked||r.macd130_positive)&&(!rs5.checked||(r.rs5??-999)>0)&&(!rs20.checked||(r.rs20??-999)>0)&&((r.vol20??0)>=mv)&&((r.bottom_score??0)>=sc));
 x.sort((a,b)=>(b.bottom_score??0)-(a.bottom_score??0));
 nshow.textContent=x.length;nseed.textContent=rows.filter(r=>r.bottom_seed).length;nturn.textContent=rows.filter(r=>r.bottom_turn).length;nconfirm.textContent=rows.filter(r=>r.bottom_confirm).length;
 count.textContent=`共 ${x.length} / ${rows.length} 檔候選`;
 const pct=v=>v==null?"-":`<span class="${v>=0?"pos":"neg"}">${v>=0?"+":""}${Number(v).toFixed(2)}%</span>`;
 const tag=v=>`<span class="tag ${v?"y":"n"}">${v?"Y":"N"}</span>`;
 const strat=r=>r.bottom_confirm?'<span class="tag confirm">確認</span>':r.bottom_turn?'<span class="tag turn">轉強</span>':r.bottom_seed?'<span class="tag seed">萌芽</span>':r.old_candidate?'<span class="tag y">KD+MACD</span>':'-';
 body.innerHTML=x.map(r=>`<tr><td>${r.market}</td><td>${r.code} ${r.name}</td><td>${strat(r)}</td><td>${r.bottom_score??0}</td><td>${r.close}</td><td>${r.k??"-"}/${r.d??"-"}</td><td>${r.kd_date??"-"}</td><td>${tag(r.vol_ok)}</td><td>${r.vol20??"-"}</td><td>${r.macd130??"-"}</td><td>${r.osc130??"-"}</td><td>${r.ma5??"-"}/${r.ma10??"-"}/${r.ma20??"-"}</td><td>${r.drop60??"-"}%</td><td>${pct(r.rs5)}</td><td>${pct(r.rs20)}</td></tr>`).join("");
}
function showBacktest(b){if(!b?.summary)return;btCard.style.display="block";let s=b.summary;let line=(n,o)=>`${n}：訊號 ${o.signals} 次｜5日 平均 ${o.avg5??"-"}% / 勝率 ${o.win5??"-"}%｜10日 ${o.avg10??"-"}% / ${o.win10??"-"}%｜20日 ${o.avg20??"-"}% / ${o.win20??"-"}%`;bt.innerHTML=[line("萌芽",s.seed),line("轉強",s.turn),line("確認",s.confirm)].join("<br>")}
</script></body></html>
