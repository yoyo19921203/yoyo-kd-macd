name: TPEx 櫃買指數 API 測試

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝 requests
        run: pip install requests

      - name: 測試官方 tpex_index
        shell: bash
        run: |
          python - <<'PY'
          import requests, json, re
          from datetime import datetime

          URL = "https://www.tpex.org.tw/openapi/v1/tpex_index"
          TARGETS = ["20260819","20260820","20260821","20260824","20260825","20260826"]

          r = requests.get(URL, timeout=30, headers={"User-Agent":"Mozilla/5.0"})
          print("HTTP:", r.status_code)
          print("URL:", r.url)
          r.raise_for_status()
          data = r.json()

          print("回傳型態:", type(data).__name__)
          print("資料筆數:", len(data) if isinstance(data, list) else "N/A")
          if isinstance(data, list) and data:
              print("第一筆欄位:", list(data[0].keys()))
              print("第一筆:", json.dumps(data[0], ensure_ascii=False))
              print("最後一筆:", json.dumps(data[-1], ensure_ascii=False))

          def digits(v):
              return re.sub(r"\D", "", str(v or ""))

          print("\n=== 尋找目標日期 ===")
          found = {}
          if isinstance(data, list):
              for row in data:
                  for k,v in row.items():
                      ds = digits(v)
                      for t in TARGETS:
                          # 同時容許西元 YYYYMMDD 或民國 YYYMMDD
                          roc = str(int(t[:4])-1911) + t[4:]
                          if t in ds or roc in ds:
                              found.setdefault(t, []).append(row)

          for t in TARGETS:
              print(f"\n{t}:")
              rows = found.get(t, [])
              if not rows:
                  print("  ❌ 沒找到")
              else:
                  for row in rows[:5]:
                      print(" ", json.dumps(row, ensure_ascii=False))

          print("\n=== 結論 ===")
          count = sum(bool(found.get(t)) for t in TARGETS)
          print(f"6 個目標交易日找到 {count} 個")
          if count >= 5:
              print("✅ 官方 tpex_index 看起來可直接提供所需歷史日期。")
          else:
              print("⚠️ 這個 OpenAPI 回傳範圍可能不是完整歷史，需改用官方歷史查詢頁的資料接口。")
          PY
