name: 修補完整成交量與上市資料

on:
  workflow_dispatch:
    inputs:
      days:
        description: 修補最近幾個 raw 日期檔
        required: true
        default: "260"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 修補完整成交量與缺失上市資料
        run: python scripts/repair_market_data_v2.py --days ${{ inputs.days }}

      - name: 提交更新
        run: |
          git config user.name "kd-macd-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data docs
          if ! git diff --cached --quiet; then
            git commit -m "修補完整成交量與上市資料"
            git push
          else
            echo "沒有需要提交的新資料"
          fi
