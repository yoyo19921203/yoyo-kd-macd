name: TPEx 歷史資料測試

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝 requests
        run: pip install requests

      - name: 測試 3324 雙鴻 8/25 vs 8/26
        run: python scripts/tpex_history_test.py
