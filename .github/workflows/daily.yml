name: 每日更新 KD+MACD 觀察名單

on:
  schedule:
    # UTC 07:30 = 台灣時間 15:30（平日收盤後）
    - cron: "30 7 * * 1-5"

  workflow_dispatch:
    inputs:
      backfill_days:
        description: "要回補的交易日數（第一次跑填 260，平常留 0）"
        required: false
        default: "0"

      report_date:
        description: "指定重算日期，例如 20260826；平常留空"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 指定日期重算
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.report_date != '' }}
        run: python scripts/fetch_and_compute.py --report-date ${{ github.event.inputs.report_date }}

      - name: 手動回補歷史
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.report_date == '' && github.event.inputs.backfill_days != '0' && github.event.inputs.backfill_days != '' }}
        run: python scripts/fetch_and_compute.py --backfill ${{ github.event.inputs.backfill_days }}

      - name: 一般排程／手動跑今天
        if: ${{ github.event_name != 'workflow_dispatch' || (github.event.inputs.report_date == '' && (github.event.inputs.backfill_days == '0' || github.event.inputs.backfill_days == '')) }}
        run: python scripts/fetch_and_compute.py

      - name: 提交更新
        if: success()
        run: |
          git config user.name "kd-macd-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "更新每日資料 $(date +%Y-%m-%d)"
          git push
